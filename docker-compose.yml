services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_applications}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-land_applications}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-land.applications,10.100.7.180,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://land.applications,https://land.applications,http://10.100.7.180,https://10.100.7.180}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://land.applications,https://land.applications,http://10.100.7.180,https://10.100.7.180}
      POSTGRES_DB: ${POSTGRES_DB:-land_applications}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-10}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Ministry of Lands and Rural Development <noreply@lands.gov.zw>}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-MIN-LANDS}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_DEMO_COUNT: ${SEED_DEMO_COUNT:-40}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - internal_net
      - edge_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    extra_hosts:
      - "land.applications:127.0.0.1"
    volumes:
      - static_data:/app/staticfiles:ro
    networks:
      - edge_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  internal_net:
    internal: true
  edge_net:

volumes:
  pgdata:
  media_data:
  static_data:
